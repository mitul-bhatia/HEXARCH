<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="Helvetica, Arial, sans-serif">
<rect width="900" height="360" fill="#fff"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<g stroke="#222" stroke-width="2" fill="none">
<rect x="340" y="20" width="220" height="60" rx="8" fill="#eef3ff"/>
<rect x="120" y="140" width="220" height="70" rx="8" fill="#e8f7ee"/>
<rect x="560" y="140" width="220" height="70" rx="8" fill="#fff4e0"/>
<rect x="300" y="270" width="300" height="70" rx="8" fill="#f3eefb"/>
<path d="M400,80 L260,140" marker-end="url(#a)"/><path d="M500,80 L640,140" marker-end="url(#a)"/>
<path d="M230,210 L380,270" marker-end="url(#a)"/><path d="M670,210 L520,270" marker-end="url(#a)"/>
</g>
<g text-anchor="middle" fill="#111">
<text x="450" y="48" font-size="20" font-weight="bold">Controller (PC, IR, ACC)</text><text x="450" y="70" font-size="14">pauses 1 cycle on a miss</text>
<text x="230" y="170" font-size="20" font-weight="bold">Instruction cache</text><text x="230" y="194" font-size="14">2 lines x 4 bytes, read-only</text>
<text x="670" y="170" font-size="20" font-weight="bold">Data cache</text><text x="670" y="194" font-size="14">2 lines x 4 bytes, write-through</text>
<text x="450" y="298" font-size="20" font-weight="bold">Shared lower-level memory</text><text x="450" y="322" font-size="14">32 bytes, ONE port: code 0-15, data 16-31</text>
<text x="270" y="255" font-size="14">miss: copy 4-byte block</text><text x="640" y="255" font-size="14">miss / STORE</text>
<text x="300" y="100" font-size="14">fetch</text><text x="610" y="100" font-size="14">LOAD / STORE</text>
</g></svg>
