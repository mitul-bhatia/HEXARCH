<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#172638"/></marker></defs><text x="45" y="43" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#172638" text-anchor="start" font-weight="bold">One controller. Two memory organizations.</text><text x="45" y="77" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#172638" text-anchor="start" font-weight="normal">Both store 16 instruction bytes and 16 data bytes.</text><text x="45" y="126" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#145f9b" text-anchor="start" font-weight="bold">HARVARD: independent instruction and data ports</text><rect x="45" y="183" width="300" height="120" rx="8" fill="#ffffff" stroke="#145f9b" stroke-width="2"/><text x="195.0" y="222" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#145f9b" text-anchor="middle" font-weight="bold">Tiny controller</text><text x="195.0" y="253" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#172638" text-anchor="middle" font-weight="normal">PC + instruction register + ACC</text><rect x="765" y="150" width="390" height="95" rx="8" fill="#ffffff" stroke="#145f9b" stroke-width="2"/><text x="960.0" y="189" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#145f9b" text-anchor="middle" font-weight="bold">Instruction memory</text><text x="960.0" y="220" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#172638" text-anchor="middle" font-weight="normal">16 x 8 bits | read only</text><rect x="765" y="285" width="390" height="95" rx="8" fill="#ffffff" stroke="#17745c" stroke-width="2"/><text x="960.0" y="324" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#17745c" text-anchor="middle" font-weight="bold">Data memory</text><text x="960.0" y="355" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#172638" text-anchor="middle" font-weight="normal">16 x 8 bits | read / write</text><path d="M 345,215 L 765,195" fill="none" stroke="#172638" stroke-width="2" marker-end="url(#arrow)"/><text x="520" y="184" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#145f9b" text-anchor="middle" font-weight="normal">PC / fetch</text><path d="M 765,227 L 345,240" fill="none" stroke="#172638" stroke-width="2" marker-end="url(#arrow)"/><text x="555" y="258" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#145f9b" text-anchor="middle" font-weight="normal">instruction</text><path d="M 345,279 L 765,320" fill="none" stroke="#172638" stroke-width="2" marker-end="url(#arrow)"/><text x="550" y="285" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#17745c" text-anchor="middle" font-weight="normal">address / write data / control</text><path d="M 765,349 L 345,302" fill="none" stroke="#172638" stroke-width="2" marker-end="url(#arrow)"/><text x="552" y="371" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#17745c" text-anchor="middle" font-weight="normal">read data</text><text x="45" y="414" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#172638" text-anchor="start" font-weight="normal">Fetch the next instruction while the current LOAD / STORE accesses data.</text><path d="M 45,444 L 1155,444" fill="none" stroke="#ccd4dc" stroke-width="1"/><text x="45" y="489" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#a54c13" text-anchor="start" font-weight="bold">SHARED: one port must take turns</text><rect x="45" y="533" width="300" height="100" rx="8" fill="#ffffff" stroke="#145f9b" stroke-width="2"/><text x="195.0" y="572" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#145f9b" text-anchor="middle" font-weight="bold">Same controller</text><text x="195.0" y="603" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#172638" text-anchor="middle" font-weight="normal">same program and data</text><rect x="440" y="533" width="260" height="100" rx="8" fill="#ffffff" stroke="#a54c13" stroke-width="2"/><text x="570.0" y="572" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#a54c13" text-anchor="middle" font-weight="bold">Address decoder</text><text x="570.0" y="603" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#172638" text-anchor="middle" font-weight="normal">instruction / data region</text><rect x="795" y="533" width="360" height="100" rx="8" fill="#ffffff" stroke="#a54c13" stroke-width="2"/><text x="975.0" y="572" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#a54c13" text-anchor="middle" font-weight="bold">Shared memory</text><text x="975.0" y="603" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#172638" text-anchor="middle" font-weight="normal">32 x 8 bits | one port</text><path d="M 345,563 L 440,563" fill="none" stroke="#172638" stroke-width="2" marker-end="url(#arrow)"/><path d="M 700,563 L 795,563" fill="none" stroke="#172638" stroke-width="2" marker-end="url(#arrow)"/><path d="M795,611 L750,611 L750,655 L195,655 L195,633" fill="none" stroke="#172638" stroke-width="2" marker-end="url(#arrow)"/><text x="392" y="647" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#172638" text-anchor="middle" font-weight="normal">read data</text><text x="45" y="683" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#172638" text-anchor="start" font-weight="normal">Addresses 0-15: instructions. Addresses 16-31: data. LOAD / STORE pauses fetch.</text></svg>
